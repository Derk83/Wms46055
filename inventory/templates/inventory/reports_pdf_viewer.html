{% extends "inventory/base.html" %}
{% load static %}
{% block title %}Daily Report Viewer · RPL Warehouse{% endblock %}

{% block content %}
<section class="pdf-viewer-page">
  <div class="pdf-viewer-chrome no-print">
    <a class="btn pdf-viewer-exit" data-action="primary" data-pdf-viewer-exit href="{{ back_url }}">
      Exit PDF
    </a>
    <div class="pdf-viewer-meta">
      <strong>Daily Activity Report</strong>
      <span class="meta">Returns to the report screen</span>
    </div>
    <div class="pdf-viewer-actions">
      <a class="btn secondary sm" href="{{ pdf_url }}" download>Download</a>
      <button class="btn secondary sm" type="button" data-pdf-viewer-print>Print</button>
    </div>
  </div>

  <div class="pdf-viewer-frame-wrap">
    <iframe
      class="pdf-viewer-frame"
      src="{{ pdf_url }}"
      title="Daily Activity Report PDF"
      aria-label="Daily Activity Report PDF"
    ></iframe>
  </div>
</section>
{% endblock %}
{% block content_tail %}
<script nonce="{{ request.csp_nonce }}">
  (function () {
    const printBtn = document.querySelector('[data-pdf-viewer-print]');
    if (!printBtn) return;
    printBtn.addEventListener('click', function () {
      const frame = document.querySelector('.pdf-viewer-frame');
      if (!frame || !frame.contentWindow) {
        window.open(frame ? frame.src : '{{ pdf_url|escapejs }}', '_blank');
        return;
      }
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch (e) {
        window.open(frame.src, '_blank');
      }
    });
  })();
</script>
{% endblock %}
