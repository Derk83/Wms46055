{% extends 'inventory/base.html' %}
{% block content %}
<div class="page-header"><h1>Receive Stock: {{ item.name }}</h1></div>
<div class="card">
  <p><strong>Current quantity:</strong> {{ item.quantity_on_hand }}</p>
  <form method="post">
    {% csrf_token %}
    <label>Quantity received</label><input name="quantity" type="number" min="1" required autofocus>
    <label>Notes</label><textarea name="notes" rows="3"></textarea>
    <div class="actions"><button class="btn btn-success" type="submit">Receive Stock</button><a class="btn btn-secondary" href="{% url 'item_detail' item.pk %}">Cancel</a></div>
  </form>
</div>
{% endblock %}
