<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0c0e">
  <title>Offline · Black Box RPL Warehouse</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0c0e;color:#f6f7f8;font:16px/1.55 system-ui,sans-serif}.offline-card{width:min(100%,520px);padding:32px;border:1px solid #34383e;border-left:5px solid #e21d2b;border-radius:14px;background:#15171a;box-shadow:0 18px 45px #0008}h1{margin:0 0 12px;font-size:clamp(28px,7vw,42px)}p{color:#c5cad1}.status{display:inline-flex;align-items:center;gap:8px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%;background:#e21d2b}.button{display:inline-flex;margin-top:12px;padding:11px 18px;border-radius:9px;background:#e21d2b;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="status"><span class="dot"></span>Connection unavailable</div>
    <h1>You're offline</h1>
    <p>This app requires a secure server connection. Changes are never saved or queued while offline, protecting warehouse quantities from stale or duplicate updates.</p>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
