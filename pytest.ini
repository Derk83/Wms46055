[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py

# Suppress only the Django 7 EMAIL_* -> MAILERS deprecation warnings.
# Django 6.1 already emits RemovedInDjango70Warning when settings.py
# declares EMAIL_BACKEND / EMAIL_HOST etc., but the new MAILERS API
# is not implemented until Django 7.0. We cannot migrate to MAILERS
# without upgrading Django. Until then, silence just these specific
# warnings so test output stays readable. Anything else (real
# deprecations, PendingDeprecationWarning) remains visible.
#
# We use message-only matching because pytest's filter loader resolves
# the category at parse time and RemovedInDjango70Warning is not
# importable until Django is loaded.
filterwarnings =
    ignore:The EMAIL_BACKEND setting is deprecated
    ignore:The EMAIL_HOST setting is deprecated
    ignore:The EMAIL_HOST_USER setting is deprecated
    ignore:The EMAIL_HOST_PASSWORD setting is deprecated
    ignore:The EMAIL_PORT setting is deprecated
    ignore:The EMAIL_USE_TLS setting is deprecated
    ignore:The EMAIL_TIMEOUT setting is deprecated
